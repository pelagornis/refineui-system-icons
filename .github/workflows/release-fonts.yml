name: Release Fonts

on:
  push:
    tags:
      - "*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-fonts:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PELAGORNIS }}
          fetch-depth: 0

      - name: Get version
        id: get_version
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: Build fonts
        run: |
          npm ci
          sudo apt-get update && sudo apt-get install -y fontforge
          pip install fonttools brotli
          npm run generate:ttf
          npm run build:fonts
          echo "✅ Fonts built successfully"

      - name: Create Fonts Archive
        run: |
          cd fonts
          zip -r ../refineui-system-icons-fonts-${{ steps.get_version.outputs.version }}.zip .
          cd ..
          echo "✅ Created fonts archive: refineui-system-icons-fonts-${{ steps.get_version.outputs.version }}.zip"

      - name: Build release notes from CHANGELOG
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          python3 scripts/extract_changelog_section.py \
            "${{ steps.get_version.outputs.version }}" \
            release-notes.md
          cat release-notes.md

      - name: Create Font Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.PELAGORNIS }}
          tag_name: ${{ steps.get_version.outputs.version }}
          name: RefineUI System Icons ${{ steps.get_version.outputs.version }}
          body_path: release-notes.md
          files: |
            refineui-system-icons-fonts-${{ steps.get_version.outputs.version }}.zip
