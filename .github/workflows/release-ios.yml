name: Release iOS Platform

on:
  push:
    tags:
      - "*"
  workflow_dispatch:
    inputs:
      version:
        description: "Semantic version to validate and release"
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-ios:
    # Keep the Xcode/Swift environment stable. `macos-latest` tracks the
    # newest macOS image and can change underneath a release workflow.
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PELAGORNIS }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install Node dependencies
        run: npm ci

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Get version
        id: get_version
        run: |
          VERSION="${{ inputs.version || github.ref_name }}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.+][0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tags must use semantic versioning (received: $VERSION)" >&2
            exit 1
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: Update iOS versions
        run: |
          VERSION="${{ steps.get_version.outputs.version }}"

          # iOS doesn't need specific version files, just build
          echo "✅ iOS version $VERSION ready for build"

      - name: Build iOS platform
        run: |
          npm run generate:icon-mapping
          npm run generate:ios

      - name: Validate iOS package
        run: |
          ulimit -n 65536
          echo "File descriptor limit increased to $(ulimit -n)"
          # Package.swift lives at the repository root and its target points
          # at ios/. Running from ios/ makes SwiftPM fail to find the manifest.
          swift package resolve
          swift build --configuration release

      - name: Build release notes from CHANGELOG
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        run: |
          python3 scripts/extract_changelog_section.py \
            "${{ steps.get_version.outputs.version }}" \
            release-notes.md
          cat release-notes.md

      - name: Create iOS Release
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.PELAGORNIS }}
          tag_name: ${{ steps.get_version.outputs.version }}
          name: RefineUI System Icons ${{ steps.get_version.outputs.version }}
          body_path: release-notes.md
