name: Release iOS Platform

on:
  push:
    tags:
      - "*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PELAGORNIS }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Get version
        id: get_version
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: Update iOS versions
        run: |
          VERSION="${{ steps.get_version.outputs.version }}"

          # iOS doesn't need specific version files, just build
          echo "✅ iOS version $VERSION ready for build"

      - name: Build iOS platform
        run: |
          npm run generate:icon-mapping
          npm run generate:ios

      - name: Validate iOS package
        run: |
          ulimit -n 65536
          echo "File descriptor limit increased to $(ulimit -n)"

          cd ios/

          swift package resolve
          swift build

      - name: Build release notes from CHANGELOG
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          python3 scripts/extract_changelog_section.py \
            "${{ steps.get_version.outputs.version }}" \
            release-notes.md
          cat release-notes.md

      - name: Create iOS Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.PELAGORNIS }}
          tag_name: ${{ steps.get_version.outputs.version }}
          name: RefineUI System Icons ${{ steps.get_version.outputs.version }}
          body_path: release-notes.md
