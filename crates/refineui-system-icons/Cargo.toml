[package]
name = "refineui-system-icons"
version = "0.5.0"
edition = "2021"
rust-version = "1.98"
publish = false
description = "RefineUI System Icons for GPUI"
license = "MIT"
repository = "https://github.com/pelagornis/refineui-system-icons"
readme = "README.md"
keywords = ["gpui", "icons", "refineui", "zed"]
categories = ["gui"]
build = "build.rs"
include = ["Cargo.toml", "README.md", "LICENSE", "build.rs", "src/**"]

[features]
default = ["gpui"]
gpui = ["dep:gpui"]

[dependencies]
# GPUI is pre-1.0 and intentionally follows its upstream API. Pin this in an
# application when reproducible builds are more important than new GPUI APIs.
gpui = { git = "https://github.com/zed-industries/zed", package = "gpui", optional = true }
